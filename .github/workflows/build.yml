# Builds Amber Writer for Windows, macOS and Linux on every push. Pushing a tag such as
# v0.7.0 also puts the three downloads on a new release page.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686 make zip
      - run: make
      - name: Package
        run: |
          VERSION=$(sed -n 's/.*AMBER_VERSION "\(.*\)".*/\1/p' src/version.h)
          cp README.md README.txt
          zip "AmberWriter-$VERSION-windows.zip" AmberWriter.exe README.txt LICENSE* THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AmberWriter-*-windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo sh unix/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: AmberWriter-*-x86_64.AppImage

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh unix/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: AmberWriter-*-mac.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, mac]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AmberWriter-*-windows.zip
            AmberWriter-*-x86_64.AppImage
            AmberWriter-*-mac.dmg
