# Builds Amber Writer for Windows, macOS and Linux on every push. When main has a version
# (in src/version.h) that has no release yet, the three downloads go on a new release
# page for it, with RELEASE-NOTES.md as the text. So to publish, raise the version.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-i686 make zip
      - run: make
      - name: Package
        run: |
          VERSION=$(sed -n 's/.*AMBER_VERSION "\(.*\)".*/\1/p' src/version.h)
          cp README.md README.txt
          zip "AmberWriter-$VERSION-windows.zip" AmberWriter.exe README.txt LICENSE* THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AmberWriter-*-windows.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo sh unix/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: AmberWriter-*-x86_64.AppImage

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh unix/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: AmberWriter-*-mac.dmg

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [windows, linux, mac]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Is this version released yet?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*AMBER_VERSION "\(.*\)".*/\1/p' src/version.h)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.new == 'yes'
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'yes'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Amber Writer ${{ steps.version.outputs.version }}
          body_path: RELEASE-NOTES.md
          files: |
            AmberWriter-*-windows.zip
            AmberWriter-*-x86_64.AppImage
            AmberWriter-*-mac.dmg
